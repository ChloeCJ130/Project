<body>
    <nav>
        <div class="logo">
            <h1>Marci Metzger Homes</h1>
        </div>
        <ul class="nav_menu">
            <li class="nav_links"><a href="index.html">Home</a></li>

            <li class="nav_links"><a href="contact.html">Contact</a></li>
            <li class="nav_links"><a href="about.html">About</a></li>
        </ul>

    <section class="hero">
        <img class="slide" src="images/image5.webp" alt="">
        <img class="slide" src="images/image2.webp" alt="">
        <img class="slide" src="images/image3.webp" alt="">
        <img class="slide" src="images/image4.webp" alt="">

        <p>Marci Metzger - The Ridge Realty Group</p>
        <h1>Pahrump Realtor</h1>
        <a href="tel:(206) 919-6886">Call Now</a>
    </section>
    <section class="partners">
        <img class="band_img" src="images/band2.webp" alt="">
        <img class="band_img" src="images/band1.webp" alt="">
        <img class="band_img" src="images/band3.webp" alt="">
        <img class="band_img" src="images/band4.webp" alt="">
    </section>

    <section class="listing_search">
        <div class="search_card">
            <h3>Search Listings</h3>
            <form class="search_form">
                <div class="search_col">
                    <div class="search_field">
                        <label for="location">Location</label>
                        <select id="location" name="location">
                            <option>Goodsprings</option>
                            <option>Pahrump</option>
                            <option>Las Vegas</option>
                        </select>
                    </div>
                    <div class="search_row">
                        <div class="search_field">
                            <label for="bedrooms">Bedrooms</label>
                            <select id="bedrooms" name="bedrooms">
                                <option>Any Number</option>
                                <option>1+</option>
                                <option>2+</option>
                                <option>3+</option>
                                <option>4+</option>
                                <option>5+</option>
                                <option>6+</option>
                            </select>
                        </div>
                        <div class="search_field">
                            <label for="baths">Baths</label>
                            <select id="baths" name="baths">
                                <option>Any Number</option>
                                <option>1+</option>
                                <option>2+</option>
                                <option>3+</option>
                                <option>4+</option>
                                <option>5+</option>
                                <option>6+</option>
                            </select>
                        </div>
                    </div>
                </div>
 
                <div class="search_col">
                    <div class="search_field">
                        <label for="type">Type</label>
                        <select id="type" name="type">
                            <option>Land</option>
                            <option>Single Family</option>
                            <option>Condo</option>
                            <option>Multi-Family</option>
                        </select>
                    </div>
                    <div class="search_row">
                        <div class="search_field underline">
                            <label for="min_price">Min Price</label>
                            <input type="text" id="min_price" name="min_price">
                        </div>
                        <div class="search_field underline">
                            <label for="max_price">Max Price</label>
                            <input type="text" id="max_price" name="max_price">
                        </div>
                    </div>
                </div>
 
                <div class="search_col">
                    <div class="search_field">
                        <label for="sort_by">Sort By</label>
                        <select id="sort_by" name="sort_by">
                            <option>Oldest</option>
                            <option>Newest</option>
                            <option>Least Expensive to Most</option>
                            <option>Most Expensive to Least</option>
                            <option>Bedrooms (Low to High)</option>
                            <option>Bedrooms (High to Low)</option>
                            <option>Bathrooms (Low to High)</option>
                            <option>Bathrooms (High to Low)</option>
                        </select>
                    </div>
                    <button type="submit" class="search_now">Search Now</button>
                </div>
            </form>
        </div>
    </section>
    <section class="services">
        <h1>Our Services</h1>
    </section>

    </section>
    <section class="testimonials">

    </section>

    </section>

    </footer>
</body>
